name: Deploy Next.js site to Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write
  issues: write


concurrency:
  group: pages
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm


      # 静态导出不需要任何依赖的构建脚本；显式忽略以避免
      # ERR_PNPM_IGNORED_BUILDS（如传递依赖 msw 的 postinstall 未批准）
      - name: Configure pnpm
        run: |
          pnpm config set ignore-scripts true


      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "=== pnpm install attempt $i ==="
            if pnpm install --no-frozen-lockfile; then
              echo "install succeeded on attempt $i"
              break
            fi
            echo "install attempt $i failed, retrying in 10s..."
            sleep 10
          done


      - name: Approve pnpm builds
        run: |
          pnpm approve-builds -y || true


      - name: Build Next.js
        run: |
          pnpm build 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then echo "build failed code=$code"; exit $code; fi


      # 任意步骤失败时把对应日志写进公开 Issue，便于无 token 诊断
      - name: Capture error to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=/tmp/build.log
          [ -s "$LOG" ] || pnpm build > "$LOG" 2>&1 || true
          B64=$(base64 -w0 "$LOG")
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"CI-build-error\",\"body\":\"$B64\"}" \
            https://api.github.com/repos/asdf18909/seasir-blog/issues || echo "failed to create issue"


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out



  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    runs-on: ubuntu-latest

    needs: build


    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


      # 成功后清理自身遗留的诊断 Issue（capture 步骤在失败时写入的 CI-build-error）
      - name: Close stale CI-build-error issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          tok = os.environ['GH_TOKEN']
          repo = 'asdf18909/seasir-blog'
          base = f'https://api.github.com/repos/{repo}'
          req = urllib.request.Request(
            f'{base}/issues?state=open&per_page=100',
            headers={'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json'})
          issues = json.load(urllib.request.urlopen(req))
          for it in issues:
              if it.get('title') == 'CI-build-error' and 'pull_request' not in it:
                  n = it['number']
                  r2 = urllib.request.Request(
                    f'{base}/issues/{n}',
                    data=json.dumps({'state': 'closed'}).encode(),
                    headers={'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                    method='PATCH')
                  urllib.request.urlopen(r2)
                  print('closed stale issue #', n)
          print('cleanup done')
          PY
